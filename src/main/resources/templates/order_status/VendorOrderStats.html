<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>월간 매입 매출 현황</h2>
        <a title="북마크" class="bookmark toggle">
          내 메뉴
        </a>
      </div>
      <ul class="page-navi">
        <li><img src="/images/icon/ico-nav-home.svg" alt="홈아이콘"></li>
        <li>주문관리</li>
        <li>월간 매입 매출 현황</li>
      </ul>
    </div>

    <section class="section">
      <div class="section-top">
        <div class="search-wrap">
          <dl>
            <dt>
              <label>
                연도
              </label>
            </dt>
            <dd>
              <select class="" id="cboYear" name="cboYear" >
              </select>
            </dd>
          </dl>
          <dl id="searchComArea">
            <dt>
              거래처
            </dt>
            <dd>
              <input type="text" id="btnCompanySearch" name="btnCompanySearch" placeholder="해당 칸을 클릭해서 검색하세요.">
              <input type="hidden" id="cboCompanyHidden">
            </dd>
          </dl>
          <dl>
            <dt>&nbsp;</dt>
            <dd>
              <li>
                <a class="btn btn-delete" title="검색" id="btnSearch">
                  <!--                                        class 쓰이는 곳 찾고 없으면 클래스명 수정하기-->
                  <img src="/images/icon/btn-srch.svg" alt="검색 아이콘">
                  검색
                </a>
              </li>
            </dd>
          </dl>
        </div>
      </div>
      <div class="tab-wrap">
        <ul class="tab-links">
          <li><a href="#tabs_sales" style="border-radius: 6px 0 0 0;">매출</a></li>
          <li><a href="#tabs_deposit">매입</a></li>
        </ul>
        <div>
          <section class="tab-item" id="tabs_sales" style="border-top-left-radius: 0;">
            <div class="chart-container" style="height: 300px;">
              <canvas id="yoySalesChart" height="300"></canvas>
              <span id="noDataMessage" style="margin-top: 150px; display: none; text-align: center; color: gray;">조회 된 데이터가 없습니다.</span>
            </div>
            <div class="container-fluid">
              <div id="theGrid" style="height: 300px;"></div>
            </div>
          </section>
          <section class="tab-item" id="tabs_deposit" style="border-top-left-radius: 0;">
              <div class="chart-container" style="height: 300px;">
                <canvas id="myChart2" height="300"></canvas>
                <span id="noDataMessage2" style="margin-top: 150px; display: none; text-align: center; color: gray;">조회 된 데이터가 없습니다.</span>
              </div>
              <div class="container-fluid">
                <div id="deposit-grid" style="height: 300px;"></div>
              </div>
          </section>
        </div>
      </div>
    </section>
  </div>
  <div class="modal">
    <div id="CltnmModal" style="display: none;">
      <div class="modal-content">
        <h2 style="text-align: center;">거래처 정보 상세</h2>
        <a title="팝업닫기" onclick="closePopup('CltnmModal')" class="btn-popup-close">
          <img src="/images/icon/btn-popup-close.svg" style=" float: right; right: 30px;" alt="닫기">
        </a>
        <form id="CltnmFindForm">
          <div id="modalGrid" style="height: 350px;width: 100%; margin-right:0px;  margin-top: 20px;"></div>
        </form>
      </div>
    </div>
  </div>
</th:block>

<th:block layout:fragment="scripts">
  <!--<th:block th:replace="/common/columns_setting :: columns_setting"></th:block>-->
  <th:block th:replace="/common/multiform_material :: multiform_material"></th:block>
  <th:block th:replace="/common/popup_company :: popup_company"></th:block>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="text/javascript">
    class MonthlySalesListPage {
      constructor() {
        this.grid = null;
        this.grid3 = null;
        this.spjangcd = $('#spjangcdHidden');
        this.viewData = new wijmo.collections.CollectionView();
        this.init();
      }

      init() {
        let _this = this;
        const monthColumns = Array.from({length: 12}, (_, i) => {
          const month = i + 1;
          return {
            binding: `mon_${month}`,
            header: `${month}월`,
            width: 120,
            align: 'right',
            allowSorting: false,
            format: 'n0',
          };
        });

        this.grid = new wijmo.grid.FlexGrid('#theGrid', {
          frozenColumns: 2,
          frozenRows: 0,
          allowSorting: wijmo.grid.AllowSorting.MultiColumn,
          selectionMode: wijmo.grid.SelectionMode.Row,
          allowMerging: wijmo.grid.AllowMerging.Cells,
          autoGenerateColumns: false,
          showMarquee: true,
          isReadOnly: true,
          formatItem: (sender, e) => {
            if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
              e.cell.style.textAlign = 'center';
            }
          },
          columns: [
            {binding: 'cltcd', header: '업체 코드', width: 250, visible: false},
            {binding: 'comp_name', header: '업체명', width: 180, align: 'left', allowMerging: false},
            ...monthColumns,  //여기에서 월별 컬럼을 삽입
            {binding: 'total_sum', header: '합계', width: 120, align: 'right', allowSorting: false},
          ],
          itemsSource: this.viewData,
        });
        this.grid.rowHeaders.columns.splice(0, 1);
        this.grid.hostElement.addEventListener('dblclick', (e) => {
          const ht = this.grid.hitTest(e);
          if (ht.cellType === wijmo.grid.CellType.Cell) {
            const row = this.grid.rows[ht.row];
            const data = row.dataItem;
            this.openSalesPopup(data);
          }
        });
        new FlexGridContextMenu(this.grid);
        this.grid.downloadFileName = '월별 매출 현황(매출)';
        //Footer 패널 사용 설정
        this.grid.columnFooters.rows.push(new wijmo.grid.Row());

        //Footer 합계 값 설정 (수동)
        this.grid.loadedRows.addHandler(() => {
          const rows = this.grid.rows;
          const footerTotal = this.grid.columnFooters.rows[0];
          const getSum = (field) => rows.map(r => +r.dataItem[field] || 0).reduce((a, b) => a + b, 0);
          // footer에 들어갈 데이터 구성
          const footerData = {
            comp_name: '합 계', // 첫 컬럼에 텍스트
          };
          monthColumns.forEach(col => {
            footerData[col.binding] = getSum(col.binding);
          });
          footerData['total_sum'] = getSum('total_sum');
          footerTotal.dataItem = footerData;
        });


        this.grid3 = new wijmo.grid.FlexGrid('#deposit-grid', {
          frozenColumns: 4,
          frozenRows: 0,
          allowSorting: wijmo.grid.AllowSorting.MultiColumn,
          selectionMode: wijmo.grid.SelectionMode.Row,
          allowMerging: wijmo.grid.AllowMerging.Cells,
          autoGenerateColumns: false,
          showMarquee: true,
          isReadOnly: true,
          formatItem: (sender, e) => {
            if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
              e.cell.style.textAlign = 'center';
            }
          },
          columns: [
            {binding: 'clt_name', header: '외주처', width: 180, align: 'left', allowMerging: false},
            ...monthColumns,
            {binding: 'total_sum', header: '합계', width: 120, align: 'right', allowSorting: false},
          ],
          itemsSource: this.viewData,
        });

        this.grid3.rowHeaders.columns.splice(0, 1);
        this.grid3.hostElement.addEventListener('dblclick', (e) => {
          const ht = this.grid3.hitTest(e); //올바르게 grid3에서 hitTest
          if (ht.cellType === wijmo.grid.CellType.Cell) {
            const row = this.grid3.rows[ht.row];
            const data = row.dataItem;
            this.openDepositPopup(data);  //입금 상세 팝업 함수 실행
          }
        });

        new FlexGridContextMenu(this.grid3);
        this.grid3.downloadFileName = '월별 매출 현황';
        //Footer 패널 사용 설정
        this.grid3.columnFooters.rows.push(new wijmo.grid.Row());
        //Footer 합계 설정
        this.grid3.loadedRows.addHandler(() => {
          const rows = this.grid3.rows;
          const footerTotal = this.grid3.columnFooters.rows[0];
          const getSum = (field) => rows.map(r => +r.dataItem[field] || 0).reduce((a, b) => a + b, 0);

          const footerData = {
            comp_name: '합 계',
          };
          monthColumns.forEach(col => {
            footerData[col.binding] = getSum(col.binding);
          });
          footerData['total_sum'] = getSum('total_sum');
          footerTotal.dataItem = footerData;
        });

      }

      searchMainData() {
        let _this = this;
        let url = '/api/VendorOrderStats'
        let baseData = {
          'cboYear': $("#cboYear").val(),
          'cboCompany': $("#cboCompanyHidden").val(),
          spjangcd:  sessionStorage.getItem('spjangcd')
        };
        //매출 내역
        AjaxUtil.getAsyncData(url + '/SalesRead', baseData, function (result) {
          if (result != null) {
            _this.grid.itemsSource = result.data;
          }
        });
        // 매출 차트 (YoY)
        AjaxUtil.getAsyncData(url + '/SalesChartRead', baseData, function (result) {
          const noDataMsg = document.getElementById('noDataMessage');

          if (result && result.data && result.data.length > 0) {
            noDataMsg.style.display = 'none';

            // labels: ['01','02',...,'12']
            const labels = result.data.map(r => r.month);

            // 당해/전년 데이터
            const cur = result.data.map(r => Number(r.cur_year_amount || 0));
            const prev = result.data.map(r => Number(r.prev_year_amount || 0));

            renderSalesChart('yoySalesChart', labels, [
              {
                label: baseData.cboYear + '년',
                data: cur,
                borderWidth: 2,
                tension: 0.3,
                fill: false
              },
              {
                label: (Number(baseData.cboYear) - 1) + '년',
                data: prev,
                borderWidth: 2,
                tension: 0.3,
                fill: false
              }
            ],'매출액');
          } else {
            noDataMsg.style.display = 'block';
            if (window.chartInstances && window.chartInstances['yoySalesChart']) {
              window.chartInstances['yoySalesChart'].destroy();
              window.chartInstances['yoySalesChart'] = null;
            }
          }
        });


        //매입 내역
        AjaxUtil.getAsyncData(url + '/DepositRead', baseData, function (result) {
          if (result != null) {
            _this.grid3.itemsSource = result.data;
          }
        });

        //매입 차트(YoY)
        AjaxUtil.getAsyncData(url + '/DepositChartRead', baseData, function (result) {
          const noDataMsg = document.getElementById('noDataMessage2');

          if (result && result.data && result.data.length > 0) {
            noDataMsg.style.display = 'none';

            const labels = result.data.map(r => r.month); // ['01'..'12']
            const cur = result.data.map(r => Number(r.cur_year_amount || 0));
            const prev = result.data.map(r => Number(r.prev_year_amount || 0));

            renderDepositChart('myChart2', labels, [
              {
                label: baseData.cboYear + '년 매입',
                data: cur,
                borderWidth: 2,
                tension: 0.3,
                fill: false
              },
              {
                label: (Number(baseData.cboYear) - 1) + '년 매입',
                data: prev,
                borderWidth: 2,
                tension: 0.3,
                fill: false
              }
            ]);
          } else {
            noDataMsg.style.display = 'block';
            if (window.chartInstances && window.chartInstances['myChart2']) {
              window.chartInstances['myChart2'].destroy();
              window.chartInstances['myChart2'] = null;
            }
          }
        },'매입액');


      }
    }

    //멀티 라인 차트
    function renderSalesChart(canvasId, labels, datasets, yTitle) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      if (!window.chartInstances) window.chartInstances = {};
      if (window.chartInstances[canvasId]) {
        window.chartInstances[canvasId].destroy();
      }

      window.chartInstances[canvasId] = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,  // canvas의 width/height 비율 유지
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'top' },
            tooltip: {
              callbacks: {
                label: (ctx) => `${ctx.dataset.label}: ${Number(ctx.parsed.y).toLocaleString()}원`
              }
            }
          },
          scales: {
            x: { title: { display: true, text: '월' } },
            y: {
              title: { display: true, text: yTitle },
              beginAtZero: true,
              ticks: { callback: v => v.toLocaleString() + '원' }
            }
          }
        }
      });
    }

    function renderDepositChart(canvasId, labels, datasets, yTitle) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      if (!window.chartInstances) window.chartInstances = {};
      if (window.chartInstances[canvasId]) {
        window.chartInstances[canvasId].destroy();
      }

      window.chartInstances[canvasId] = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'top' },
            tooltip: {
              callbacks: {
                label: (ctx) => `${ctx.dataset.label}: ${Number(ctx.parsed.y).toLocaleString()}원`
              }
            }
          },
          scales: {
            x: { title: { display: true, text: '월' } },
            y: {
              title: { display: true, text: yTitle },
              beginAtZero: true,
              ticks: { callback: v => v.toLocaleString() + '원' }
            }
          }
        }
      });
    }

    let page = null;

    $(document).ready(function (e) {
      page = new MonthlySalesListPage();

      AjaxUtil.fillSelectOptions($('#cboYear'), 'data_year', '', false);

      // 현재 날짜 가져오기
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth(); // 0부터 시작하는 월(0 = 1월)

      // 시작일: 이번 달 1일
      const startOfMonth = new Date(year, month, 1);
      const startMonthFormatted = startOfMonth.getFullYear() + '-' + String(startOfMonth.getMonth() + 1).padStart(2, '0') + '-' + String(startOfMonth.getDate()).padStart(2, '0');
      $('#startDate').val(startMonthFormatted);

      // 종료일: 오늘 날짜
      const todayFormatted = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
      $('#endDate').val(todayFormatted);
      page.searchMainData();

      // 검색
      $('#btnSearch').click(function (e) {
        if ($('#cboCompany').val() !== '' && $('#cboCompanyHidden').val() === '') {
          // 업체명 텍스트는 썼지만, 업체 검색 버튼 안 눌렀을 때
          page.searchMainData();
        } else {
          page.searchMainData();
        }
      });

      $('#btnGridSetting').click(function (e) {
        let _this = this;
        let fix_cols = page.grid_config.frozenColumnIndex;
        page.popColSetting.show(gui.gui_code, gui.template_key, 'grid', page.grid_config.columns, page.grid, {
          'order_fix': false,
          'fix_cols': fix_cols
        });
      });

      $('#btnCompanySearch').click(function () {
        let poppage = new PopCompComponent();
        let $poppage = $(poppage);
        let searchcallback = function (items) {
          //console.log('items : ',items);
          document.getElementById('btnCompanySearch').value = items.compname;
          document.getElementById('cboCompanyHidden').value = items.id;
        };

        poppage.show(searchcallback);
      });

      $('#btnCompanySearch').on('input', function () {
        const val = $(this).val();
        if (val === '') {
          $('#cboCompanyHidden').val('');
        }
      });

      // .btn-clear 클릭 후 input 이벤트 강제 발생
      $(document).on('click', '.btn-clear', function () {
        const $input = $(this).siblings('input[type="text"]');
        $input.val('');
        $input.trigger('input'); // 🔥 input 이벤트 강제 발생
      });
      // 초기화 버튼 클릭 이벤트
      $('#btnClear').click(function () {

        document.getElementById('cboCompany').value = '';
        document.getElementById('cboCompanyHidden').value = '';
      });

    })
  </script>

</th:block>

<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</html>
